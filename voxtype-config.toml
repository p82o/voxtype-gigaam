# Reference voxtype config for GigaAM v3 e2e RNN-T (remote mode).
#
# install.sh merges the sections below into your existing
# ~/.config/voxtype/config.toml. Your existing [hotkey] section is NEVER
# touched — keep your own push-to-talk key (F9 here is just an example).
#
# All keys are from a verified working config (voxtype 1.0.1, CachyOS,
# niri + GNOME, 2026-09).
engine = "whisper"

[whisper]
model = "gigaam-v3-e2e-rnnt"
mode = "remote"
remote_endpoint = "http://127.0.0.1:8394"
remote_model = "gigaam-v3-e2e-rnnt"
remote_timeout_secs = 60
language = "ru"
translate = false
flash_attention = false
on_demand_loading = false
gpu_isolation = false

[audio]
device = "default"
max_duration_secs = 300
pause_media = false
duck_media = false
duck_media_volume_percent = 70
