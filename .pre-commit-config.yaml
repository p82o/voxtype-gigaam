repos:
  - repo: local
    hooks:
      - id: dependency-audit
        name: Audit dependency locks
        entry: bash scripts/audit.sh
        language: system
        pass_filenames: false
        files: '(^.*requirements\.(txt|lock)$|^Dockerfile$|^\.dockerignore$|^server/|^model/|^security/|^scripts/(audit.*|update-lock\.sh)$)'
